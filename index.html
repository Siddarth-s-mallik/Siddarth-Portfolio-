<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <script>
    window.onload = function () {
      // Check if root is empty after a timeout
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          document.body.innerHTML += '<div style="color:red;padding:20px;background:white;z-index:9999;position:fixed;top:0;">App did not mount. Check console.</div>';
        }
      }, 3000);
    };
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      var str = "Error: " + msg + " at " + lineNo + ":" + columnNo;
      var div = document.createElement("div");
      div.style.cssText = "position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:9999;";
      div.textContent = str;
      document.body.appendChild(div);
      return false;
    };
  </script>
  <script type="module" crossorigin src="./assets/index-CehosVkl.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B0Hb4noF.css">
</head>

<body style="background-color: #0a0a0a; margin: 0;">
  <div id="root">
    <div
      style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #030014; color: white;">
      Loading Portfolio V4...
    </div>
  </div>
</body>

</html>
